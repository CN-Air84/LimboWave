[project]
name = "limbowave"
version = "0.0.1"
description = "LimboWave / 灵波 — Windows 优先的桌面聊天与 Agent 双核心 Harness。"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    "httpx>=0.27",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "platformdirs>=4.2",
    "markdown-it-py>=3.0",
    "pygments>=2.17",
    "Pillow>=10.0",
    "pypinyin>=0.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pygments>=2.21",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limbowave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 注释与文档字符串使用中文全角标点是有意为之，与 RUF001/002/003 直接冲突。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# qasync 未发布 py.typed，上游也没有 stub 包。这里只豁免这一个模块，
# 不使用全局 ignore_missing_imports。
[[tool.mypy.overrides]]
module = ["qasync", "qasync.*"]
ignore_missing_imports = true
